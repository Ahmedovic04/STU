version: '3.8'

services:
  app:
    build: .
    environment:
      - MYSQLHOST=db
      - MYSQLDATABASE=school_dismissal
      - MYSQLUSER=root
      - MYSQLPASSWORD=root
    depends_on:
      - db

  db:
    image: mariadb:10.6
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=school_dismissal
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
